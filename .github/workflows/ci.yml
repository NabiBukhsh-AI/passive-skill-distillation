name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch, but never on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Determinism (spec Section 13.3). Analyzer output must be byte-stable across runs.
  PYTHONHASHSEED: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Typecheck
        run: uv run mypy

      - name: Gap register (TASK-001)
        run: uv run python scripts/check_gaps.py

      - name: Architecture rules (TASK-007)
        run: uv run lint-imports --config .import-linter

      - name: Unit, property, and contract tests
        run: uv run pytest tests/unit tests/property tests/contract

      # Starts a real PostgreSQL 16 from the pgserver wheel. TASK-013's acceptance is a
      # DATABASE-level constraint, which cannot be demonstrated against a mock.
      - name: Integration tests (real PostgreSQL)
        run: uv run pytest tests/integration

  # Separate job so it cannot be lost inside a long log, and so a red security run is
  # unmistakable. Spec Section 21.1: blocking, never skippable.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --all-groups

      - name: Security suite (blocking, never skip)
        # -p no:randomly and --strict-markers keep the suite deterministic; `-x` is
        # deliberately absent so a run reports every failure rather than only the first.
        run: uv run pytest tests/security --strict-markers

      - name: Assert the security suite was not empty
        # A suite that collects zero tests exits 5, but a misconfigured path could also
        # collect zero and be waved through by a lenient invocation. Check explicitly.
        run: |
          COUNT=$(uv run pytest tests/security --collect-only -q | tail -1)
          echo "collected: $COUNT"
          case "$COUNT" in
            "no tests ran"*|"") echo "SECURITY SUITE IS EMPTY"; exit 1 ;;
          esac

  # The reproduction targets must fail until Phase 5 lands. If this job ever goes green,
  # something made `make reproduce-r0` exit 0 without running a reproduction.
  reproduction-still-guarded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: R0 must still refuse to run
        run: |
          if uv run python scripts/reproduce.py r0; then
            echo "reproduce r0 exited 0 while unimplemented. See scripts/reproduce.py."
            exit 1
          fi
          echo "R0 correctly refused to run."
